name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }} desktop bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            triple: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: dmg
          - name: Windows x64
            os: windows-2022
            triple: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.triple }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TASKLENS_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json

    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check the tag matches package.json
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(bun -e 'console.log(require("./package.json").version)')"
      - name: Build signed updater bundle
        run: bun run desktop:release-build -- --bundles ${{ matrix.bundles }}
      - name: Collect installer and updater files
        run: bun run desktop/scripts/collect-release-assets.ts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop/release-assets/
          if-no-files-found: error

  release:
    name: Publish desktop installers and updates
    needs: build
    runs-on: ubuntu-latest
    env:
      TASKLENS_RELEASE_VERSION: ${{ github.ref_name }}
      TASKLENS_RELEASE_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@v4
        with:
          path: desktop/release-assets
          merge-multiple: true
      - name: Create the signed updater manifest
        shell: bash
        run: |
          export TASKLENS_RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          bun run desktop/scripts/create-update-manifest.ts
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: desktop/release-assets/**
