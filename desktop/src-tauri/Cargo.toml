[package]
name = "tasklens-desktop"
version = "0.2.0"
description = "TaskLens desktop dashboard"
authors = ["TaskLens contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde_json = "1"
